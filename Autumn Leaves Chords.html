<!DOCTYPE html>
<html>
<head>
  <title>Autumn Leaves Chords</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
    }

    table {
      border-spacing: 0 30px;
    margin-left: auto;
    margin-right: auto;
    width: 98%;              /* Make table span the full page width */
    table-layout: fixed;       /* Force equal-width columns */
}

td, th {
    border: 2px solid #000;    /* Optional: add borders */
  border-top: none;
  border-bottom: none;
    text-align: left;        /* Optional: center text */
    padding: 8px;              /* Optional: spacing inside cells */
  font-size: x-large;
}
td, th {
    border-left: 1px solid black;
    border-right: 1px solid black;
}

/* Make first and last cell borders double width */
tr td:first-child,
tr th:first-child {
    border-left-width: 2px;
}

tr td:last-child,
tr th:last-child {
    border-right-width: 2px;
}
    
  </style>
</head>
<body>
  <h1>Autumn Leaves</h1>

  <td>A0</td><td>D7b9</td><td>Gm6</td><td>/</td>
  </tr>
    
  <tr>
  <td>Cm</td><td>F7</td><td>BbM</td><td>EbM</td>
  <td>A0</td><td>D7b9</td><td>Gm6</td><td>/</td>
  </tr>
    
  <tr>
  <td>A0</td><td>D7b9</td><td>Gm6</td><td>/</td>
  <td>Cm</td><td>F7</td><td>BbM</td><td>EbM</td>
  </tr>
  
  <tr>
  <td>A0</td><td>D7b9</td><td>Gm6</td><td>/</td>
  <td>A0</td><td>D7b9</td><td>Gm6</td><td>/</td>
  </tr>
  </table>
</body>
</html>
